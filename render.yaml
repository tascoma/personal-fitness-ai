# Render Blueprint — defines all environments as code.
#
# Branch → environment mapping:
#   main → production   (pfa-*-prod)
#   dev  → staging      (pfa-*-staging)
#
# Each service auto-deploys when its branch receives a push. Create the
# Blueprint once in the Render dashboard (New → Blueprint, connect this repo
# on the `main` branch); Render then reads this file to provision/update all
# four services. Secrets (DATABASE_URL, API keys) are entered once in the
# shared env group below.

envVarGroups:
  # Shared across both backend environments — staging and prod point at the
  # same database/keys per the chosen setup. Fill these in once in the
  # dashboard after the Blueprint is created.
  - name: pfa-shared-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

services:
  # ───────────────────────── Backend — production (main) ─────────────────────
  - type: web
    name: pfa-backend-prod
    runtime: python
    rootDir: backend
    branch: main
    plan: free
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: STORAGE_BUCKET
        value: uploads
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://pfa-frontend-prod.onrender.com
      - fromGroup: pfa-shared-secrets

  # ───────────────────────── Backend — staging (dev) ─────────────────────────
  - type: web
    name: pfa-backend-staging
    runtime: python
    rootDir: backend
    branch: dev
    plan: free
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: INFO
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: STORAGE_BUCKET
        value: uploads
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://pfa-frontend-staging.onrender.com
      - fromGroup: pfa-shared-secrets

  # ──────────────────────── Frontend — production (main) ─────────────────────
  - type: web
    name: pfa-frontend-prod
    runtime: static
    rootDir: frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pfa-backend-prod.onrender.com
    routes:
      # SPA fallback — serve index.html for client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html

  # ──────────────────────── Frontend — staging (dev) ─────────────────────────
  - type: web
    name: pfa-frontend-staging
    runtime: static
    rootDir: frontend
    branch: dev
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pfa-backend-staging.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
