services:
  - type: web
    name: personal-fitness-ai-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://personal-fitness-ai-frontend.onrender.com
      # Supabase Postgres connection string (Session/Transaction pooler URL).
      - key: DATABASE_URL
        sync: false
      # Supabase project URL + service-role key for storage and admin access.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: uploads
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: personal-fitness-ai-backend-staging
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    branch: dev
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://personal-fitness-ai-frontend-staging.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: uploads
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: LOG_LEVEL
        value: DEBUG

  - type: web
    name: personal-fitness-ai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: main
    envVars:
      - key: VITE_API_URL
        value: https://personal-fitness-ai-backend.onrender.com

  - type: web
    name: personal-fitness-ai-frontend-staging
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: dev
    envVars:
      - key: VITE_API_URL
        value: https://personal-fitness-ai-backend-staging.onrender.com
