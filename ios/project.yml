name: PFA
options:
  bundleIdPrefix: com.tonyscoma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  PFA:
    type: application
    platform: iOS
    sources:
      - path: PFA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonyscoma.pfa
    info:
      path: PFA/Info.plist
      properties:
        CFBundleDisplayName: Personal Fitness
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Allow plain-HTTP requests to the local dev backend (http://127.0.0.1:8000).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBold.ttf
          - Inter-Variable.ttf

  PFATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PFATests
    dependencies:
      - target: PFA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PFA:
    build:
      targets:
        PFA: all
        PFATests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: API_BASE_URL
          value: http://127.0.0.1:8000
          isEnabled: true
    test:
      config: Debug
      targets:
        - PFATests
